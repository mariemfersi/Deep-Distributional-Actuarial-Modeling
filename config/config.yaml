paths:
  raw_freq: "data/raw/freMTPL2freq.csv"
  raw_sev: "data/raw/freMTPL2sev.csv"
  processed_dir: "data/processed"

pricing:
  large_claim_threshold: 100000
  exposure_cap: 1.0
  claim_nb_cap: 4
  train_test_split:
    train: 0.6
    valid: 0.2
    test: 0.2
    seed: 123
  driv_age_bins: [17, 20, 25, 30, 40, 50, 70, 120]
  driv_age_labels: ["18-20", "21-25", "26-30", "31-40", "41-50", "51-70", "71+"]
  veh_age_bins: [-1, 0, 10, 200]
  veh_age_labels: ["neuf", "recent", "ancien"]
  bm_bins: [49, 60, 80, 100, 125, 150, 350]
  bm_labels: ["50-60", "61-80", "81-100", "101-125", "126-150", "151+"]

  reserving:
    line_of_business: "ppauto"
    train_valid_test_seed: 123