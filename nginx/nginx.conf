# ─────────────────────────────────────────────────────────────────
#  Reverse proxy — Point d'entrée unique (port 8080)
#  /api/*  →  backend FastAPI  (port interne 8000)
#  /       →  frontend Next.js (port interne 3000)
# ─────────────────────────────────────────────────────────────────

upstream backend {
    server backend:8000;
}

upstream frontend {
    server frontend:3000;
}

server {
    listen 80;
    server_name _;

    # ── Taille max upload (pour futures extensions) ──────────────
    client_max_body_size 10M;

    # ── API → Backend FastAPI ───────────────────────────────────
    #  Le navigateur appelle /api/pricing/predict
    #  nginx strip /api/ et transmet /pricing/predict au backend.
    location /api/ {
        proxy_pass http://backend/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts generieux pour le ML (Mack fitting, SHAP, CANN)
        proxy_connect_timeout 60s;
        proxy_read_timeout    120s;
        proxy_send_timeout    120s;
    }

    # ── Frontend Next.js (catch-all) ────────────────────────────
    location / {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket (utile en dev pour HMR Next.js)
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
